<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>태양 관측소</title>
<meta name="description" content="태양의 표면(광구·쌀알무늬·흑점)과 대기(채층·코로나·홍염·플레어)를 관측하고, 흑점 수 변화와 태양 활동이 지구에 미치는 영향을 찾는 수업 자료">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b1a; --panel:#111934; --line:#2a3768;
  --text:#eef2ff; --muted:#a9b4d8; --accent:#ffcf5a; --accent2:#7cc4ff;
  --ok:#5fe0a0; --bad:#ff8a8a; --chip:#1f2b5a; --chiph:#2b3a78;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;min-height:100vh;-webkit-tap-highlight-color:transparent}
/* 우주 배경: 오른쪽 위의 햇빛, 왼쪽 아래의 푸른 성운, 별, 태양을 둘러싼 궤도선 (화면을 내려도 그대로) */
html{background:radial-gradient(1100px 760px at 100% -8%,rgba(255,160,60,.17),transparent 62%),radial-gradient(900px 700px at -12% 108%,rgba(80,90,230,.2),transparent 62%),radial-gradient(800px 560px at 55% 55%,rgba(120,60,200,.08),transparent 70%),#070b1a;background-attachment:fixed;min-height:100%}
html body{background:transparent}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1}
body::before{background-image:radial-gradient(1.2px 1.2px at 24px 36px,#ffffffb0,transparent),radial-gradient(1px 1px at 132px 92px,#ffffff80,transparent),radial-gradient(1.6px 1.6px at 214px 170px,#fff4d8c0,transparent),radial-gradient(1px 1px at 318px 44px,#ffffff70,transparent),radial-gradient(1.2px 1.2px at 392px 226px,#d8e6ffa0,transparent),radial-gradient(1px 1px at 76px 210px,#ffffff60,transparent);background-size:440px 270px;opacity:.55}
body::after{background:radial-gradient(circle at 100% 0,transparent 0 259px,rgba(255,207,90,.10) 260px 261px,transparent 262px),radial-gradient(circle at 100% 0,transparent 0 459px,rgba(124,196,255,.08) 460px 461px,transparent 462px),radial-gradient(circle at 100% 0,transparent 0 719px,rgba(124,196,255,.07) 720px 721px,transparent 722px),radial-gradient(circle at 100% 0,transparent 0 1039px,rgba(180,150,255,.06) 1040px 1041px,transparent 1042px)}
.panel{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#app{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
#app:has(.cl-stage){max-width:1880px} /* 수업 모드(TV)는 화면을 넓게 */
h1,h2,h3,.title{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.5px;margin:0}
h1{font-size:clamp(36px,6vw,58px);line-height:1.15}
h3{font-size:22px;margin-bottom:6px}
p{margin:.4em 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:#1b1400;border:0;border-radius:999px;padding:12px 24px;font-weight:700;font-size:17px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.small{padding:7px 14px;font-size:14px}
.panel{background:rgba(17,25,52,.86);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
input{font:inherit;color:var(--text);background:#0b1230;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus{outline:2px solid var(--accent2);border-color:transparent}
label{display:block;font-weight:700;margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top .grow{flex:1}
.pill{background:var(--chip);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.pill b{color:var(--text)}

.intro{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:center;min-height:88vh}
.intro>*{min-width:0}
.intro-r{display:flex;flex-direction:column;gap:12px}
.kicker{color:var(--accent2);font-weight:700;margin:0;font-size:14px}
.lead{font-size:18px}
.lead b{color:var(--accent)}
@media (max-width:920px){.intro{grid-template-columns:1fr;min-height:auto}}

/* 관측 화면 */
.stage{position:relative;width:100%;height:min(66vh,640px);min-height:320px;border-radius:var(--r);overflow:hidden;background:#050914;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
@media (max-width:920px){.stage{height:min(56vh,540px)}}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .hud{position:absolute;left:10px;top:10px;right:10px;pointer-events:none;font-size:15px;font-weight:700;line-height:1.4}
.stage .hud span{display:inline-block;background:#08102ecc;border:1px solid #ffffff26;border-radius:12px;padding:5px 12px}
.stage .hud span:empty{display:none}

.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.group{display:flex;gap:3px;flex-wrap:wrap;align-items:center;background:#0b1230;border:1px solid var(--line);border-radius:999px;padding:3px}
.group .lbl{font-size:13px;color:var(--muted);padding:0 6px 0 10px}
.chip{background:var(--chip);border:1.5px solid transparent;border-radius:999px;padding:6px 14px;font-size:15px;min-height:40px}
.chip:hover{background:var(--chiph)}
.chip.on{background:var(--accent2);color:#06142b;font-weight:700}
.chip.big{font-weight:700;padding:6px 20px}
.chip.play{background:var(--accent);color:#1b1400;font-weight:700}
.chip.hot{background:#ff8a3d;color:#1b0a00;font-weight:700}
.group .chip{min-height:36px;padding:4px 12px}
.rng{width:min(300px,52vw);accent-color:var(--accent);background:transparent;border:0;padding:0 10px;margin:0;height:36px}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--chip);border:1.5px solid transparent;border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px}
.tab.on{border-color:var(--accent);color:var(--accent);background:var(--chiph)}
.lesson{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:14px;align-items:start}
.lesson>*{min-width:0}
@media (max-width:920px){.lesson{grid-template-columns:1fr}}
.concept ol{padding-left:22px;margin:8px 0}
.concept li{margin:10px 0;font-size:17px;line-height:2}
.blank{display:inline-block;min-width:54px;text-align:center;border:0;border-bottom:2.5px solid var(--accent);background:#ffcf5a14;color:var(--accent);padding:0 8px;margin:0 2px;font-weight:700;border-radius:6px 6px 0 0;line-height:1.6}
button.blank:not(.show){color:transparent}
.blank.ok{border-color:var(--ok);color:var(--ok)}
/* 수업 모드: TV로 함께 보도록 관측 화면을 크게, 정리 카드는 아래에 큰 글씨로 */
/* 수업 모드: 넓은 화면에서는 버튼을 관측 화면 오른쪽 세로 칸에 모아 스크롤 없이 조작해요 */
.cl-stage .stage{height:max(420px,calc(100vh - 200px))}
@media (min-width:1000px){
  .cl-stage{display:grid;grid-template-columns:minmax(0,1fr) clamp(250px,21vw,340px);gap:12px;align-items:start}
  .cl-stage .stage{height:max(420px,calc(100vh - 100px))}
  .cl-side{max-height:calc(100vh - 100px);overflow-y:auto;overflow-x:hidden;padding-right:2px}
  .cl-side .ctrl{flex-direction:column;align-items:stretch;margin:0 0 10px}
  .cl-side .ctrl>*{max-width:100%}
  .cl-side .group{border-radius:16px;padding:5px}
  .cl-side .group .lbl{flex-basis:100%;padding:2px 8px 4px}
  .cl-side .group .chip{flex:1 1 auto}
  .cl-side .ctrl>.chip,.cl-side .ctrl>button{width:100%}
  .cl-side input[type=range]{width:100%}
}
.cl-stage .chip{font-size:17px;min-height:46px}
.cl-stage .group .chip{min-height:42px}
.cl-stage .stage .hud{font-size:clamp(18px,1.9vw,28px)}
.concept.big{margin-top:16px}
.concept.big h3{font-size:clamp(24px,2.6vw,34px)}
.concept.big li{font-size:clamp(22px,2.4vw,32px);margin:12px 0}
.concept.big .ask{font-size:clamp(19px,1.9vw,26px)}
button.blank:not(.show){color:#ffcf5aa8;letter-spacing:.12em}
.concept.big h3{font-size:clamp(30px,3.2vw,48px)}
.concept.big li{font-size:clamp(28px,3vw,46px);margin:14px 0;line-height:1.9}
.concept.big .ask{font-size:clamp(24px,2.4vw,36px);line-height:1.6}
.concept.big .note{font-size:clamp(18px,1.6vw,24px)}
.concept.big .blank{min-width:1.6em;padding:0 .3em}
.concept.big ol{font-size:clamp(28px,3vw,46px);padding-left:1.6em}
.wsp{display:inline-block;background:#3dff8f;color:#03230f;font-weight:900;border-radius:999px;padding:4px 16px;font-size:clamp(17px,1.5vw,22px);box-shadow:0 0 16px #3dff8f88;white-space:nowrap;margin:0 8px}
.wsp.none{background:#c4b0ff;color:#1a0b45;box-shadow:0 0 16px #c4b0ff88}
.concept.big .wsp{font-size:clamp(24px,2.3vw,34px);padding:6px 22px}
.concept .ex{color:#c4b0ff}
.concept .wsk{color:#fff}
.concept.big .leg{font-size:clamp(20px,1.8vw,28px)}
.ask{background:#1c2a5c;border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin-top:12px;font-size:15px}
.ask b{color:var(--accent)}

.mcards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:700px){.mcards{grid-template-columns:1fr}}
.mcard{display:flex;flex-direction:column;gap:8px}
.mcard .n{font-family:"Do Hyeon";color:var(--accent);font-size:15px}
.mcard.lock{opacity:.5}
.mcard .row{margin-top:auto}
.st-done{color:var(--ok);font-weight:700}
.check{list-style:none;padding:0;margin:6px 0 12px}
.check li{padding:3px 0}
.check li.ok{color:var(--ok)}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-of-type{border-top:0}
.q.locked{opacity:.4}
.q .s{font-size:17px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{background:var(--chip);border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;font-size:15px;text-align:left}
.opt:hover{background:var(--chiph)}
.opt:disabled{cursor:default}
.opt.no{opacity:.35;text-decoration:line-through;pointer-events:none}
.opt.sel{background:var(--accent);color:#1b1400;border-color:var(--accent);opacity:1}
.fb{font-size:15px;margin-top:6px}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.fb.ex{color:var(--text);background:#16224a;border-radius:8px;padding:6px 10px}
.done{background:#173a2c;border:1px solid var(--ok);border-radius:12px;padding:12px 14px;margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.done b{flex:1;min-width:160px}
.quiz{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.quiz>*{min-width:0}
@media (max-width:820px){.quiz{grid-template-columns:1fr}}
.quiz .q{border-top:0;padding:0}
svg.fig{width:100%;max-height:230px;border-radius:10px;background:#0b1230;display:block;margin-bottom:10px}
svg.fig.ph{max-height:320px}
.score{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:16px;margin:10px 0}
.score dt{color:var(--muted)}
.score dd{margin:0;font-weight:700}
.boxq{background:#0b1230;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.bogi{background:#0b1230;border:1px dashed #5a6bb0;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px;line-height:1.8}
details.tip{background:#13204a;border:1px solid #3d5bb0;border-radius:12px;padding:10px 14px;margin:10px 0}
details.tip summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:16px}
.ttable{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.ttable th,.ttable td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.ttable th{color:#ffd9a8;font-weight:700;white-space:nowrap}

/* 임무 2: 분류 카드 */
.sort{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.scard{background:#0b1230;border:1.5px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.scard.ok{border-color:var(--ok)}
.scard svg{width:84px;height:84px;border-radius:10px;display:block}
.scard .nm{font-weight:700}
.scard .opts{justify-content:center;margin-top:0}
.scard .opt{padding:4px 10px;font-size:13px}

.tstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.tstats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted)}
.tstats b{display:block;font-family:"Do Hyeon";font-size:28px;color:var(--text)}
.tbl-wrap{overflow-x:auto}
.ttbl{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
.ttbl th,.ttbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
.ttbl th{color:var(--muted);font-weight:500}
.tok{color:var(--ok);font-weight:700}

/* 마지막 게임: 태양 탐정 */
.ghud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ghud .pill{font-size:16px;padding:6px 14px}
.ghud .hearts{font-size:22px;letter-spacing:2px}
.gwrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:14px;align-items:start}
.gwrap>*{min-width:0}
@media (max-width:820px){.gwrap{grid-template-columns:1fr}}
.gpic{position:relative;overflow:hidden;border-radius:14px;background:#000;margin:0 auto;border:1px solid var(--line);max-width:100%;width:min(100%,calc(56vh * var(--ar)))}
/* 좁은 화면: 사진과 보기가 한 화면에 들어오게 사진을 줄여요 (1단계는 10초 안에 골라야 해서) */
@media (max-width:820px){.gpic{width:min(100%,calc(34vh * var(--ar)))}}
.gpic img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none}
.gpic.tap{cursor:crosshair;touch-action:manipulation}
.gmark{position:absolute;transform:translate(-50%,-50%);border:4px solid var(--ok);border-radius:50%;box-shadow:0 0 0 3px #000a,inset 0 0 0 2px #000a;pointer-events:none;aspect-ratio:1}
.gdot{position:absolute;width:22px;height:22px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #fff;background:#ff5a5acc;pointer-events:none}
.gdot.ok{background:#5fe0a0cc}
.gbar{height:14px;background:#0b1230;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.gbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff8a3d,var(--accent))}
.gq{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-size:clamp(24px,3vw,34px);line-height:1.3;margin:0 0 8px}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.gopts.one{grid-template-columns:1fr}
.gopts .opt{font-size:19px;padding:14px 12px;text-align:center;border-radius:14px;font-weight:700}
.gopts .opt.lv0{border-color:#5fe0a0}.gopts .opt.lv1{border-color:#ffcf5a}.gopts .opt.lv2{border-color:#ff8a8a}
.gres{border-radius:14px;padding:14px 16px;margin:10px 0;font-size:18px}
.gres.ok{background:#173a2c;border:1px solid var(--ok)}
.gres.bad{background:#3a1c22;border:1px solid var(--bad)}
.gres b{font-family:"Do Hyeon";font-size:26px;font-weight:400;display:block}
.gnote{background:#0b1230;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:18px;margin:10px 0}
.gnote b{color:var(--accent)}
.glegend{list-style:none;padding:0;margin:8px 0;font-size:15px}
.glegend li{padding:3px 0}
.gpic>svg{position:absolute;inset:0;width:100%;height:100%;margin:0;max-width:none}
/* 2단계 우주 기상 상황실 */.sim{background:#050914;border:1px solid var(--line);border-radius:16px;padding:12px;max-width:1000px;margin:0 auto}
.simtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.simgraph{flex:1 1 240px;height:64px;background:#0b1230;border-radius:10px}
.simstat{font-size:18px;line-height:1.5}
.simstat b{color:var(--accent)}
.simfield{position:relative;height:clamp(180px,34vh,320px);margin:10px 0;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 12% 50%,#2a1606,#03050d 55%)}
.simsun{position:absolute;left:3%;top:50%;width:clamp(78px,14vw,160px);aspect-ratio:1;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff1b8,#ffb347 60%,#e8701a);box-shadow:0 0 calc(12px + var(--c,0) * 70px) calc(2px + var(--c,0) * 26px) #ffe6a099;transition:filter .2s}
.simsun.fl{filter:brightness(1.8) saturate(1.3)}
.simsun i{position:absolute;width:9%;aspect-ratio:1;border-radius:50%;background:#3a1806}
.simearth{position:absolute;right:4%;top:50%;transform:translateY(-50%);font-size:clamp(44px,7vw,84px);line-height:1}
.wind{position:absolute;top:50%;width:clamp(26px,4vw,46px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(#fff,#ffcf5a 35%,#ff8a3a00 70%);pointer-events:none}
#simAlerts{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:grid;gap:6px;width:min(70%,520px);pointer-events:none}
.simalert{position:relative;overflow:hidden;background:#3a1c22f0;border:1px solid var(--bad);border-radius:10px;padding:6px 10px 8px;font-size:clamp(15px,1.9vw,21px);font-weight:700;color:#ffd6d6}
.simalert.info{background:#0f2a4af0;border-color:#7cc4ff;color:#d6ecff}
.simalert b{font-family:"Do Hyeon";font-weight:400;color:#fff;margin-right:6px}
.simalert i{position:absolute;left:0;bottom:0;height:4px;background:#ff8a8a}
.simmsg{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:94%;pointer-events:none}
.simmsg span{border-radius:10px;padding:4px 10px;font-weight:700;font-size:clamp(14px,1.7vw,18px)}
.simmsg .ok{background:#173a2cf0;color:#9ff0c4}.simmsg .bad{background:#3a1c22f0;color:#ffb0b0}
.simaur{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:58px;background:#0b1230;border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:17px}
.simaur.live{border:2px solid #9be8c8;background:#10302a;animation:gblink2 .8s ease-in-out 3}
@keyframes gblink2{50%{background:#1d5a4a}}
.simfac{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.simfac button{background:#0b1230;border:2px solid var(--line);border-radius:14px;color:inherit;font:inherit;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:17px;touch-action:manipulation}
.simfac .ico{font-size:clamp(28px,4vw,42px);line-height:1.1}
.simfac small{color:#7cc4ff;font-size:13px}
.simfac button.on{border-color:#7cc4ff;background:#10264a;box-shadow:0 0 0 4px #7cc4ff55,inset 0 0 20px #7cc4ff66}
.simfac button.hurt{border-color:var(--bad);background:#3a1c22;animation:gshake .25s 3}
@keyframes gshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (max-width:620px){

  }, { passive: true });
  addEventListener('pointerdown', e => {
    if (!inClass() || !want || e.target === btn) return;
    if (e.pointerType === 'mouse') ring.classList.add('down');
    const w = document.createElement('div'); w.className = 'lp-wave'; w.style.left = e.clientX + 'px'; w.style.top = e.clientY + 'px';
    document.body.appendChild(w); setTimeout(() => w.remove(), 650);
  }, true);
  addEventListener('pointerup', () => ring.classList.remove('down'), true);
  document.addEventListener('mouseleave', () => { ring.style.display = 'none'; });
  new MutationObserver(sync).observe(document.getElementById('app') || document.body, { childList: true });
  sync();
})();
</script>

</body>
